name: Build GameForge Runtime GUI

on:
  push:
    branches:
      - main
    paths:
      - 'runtime/**'
      - '.github/workflows/runtime-build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'runtime/**'
      - '.github/workflows/runtime-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build Forge runtime
        shell: bash
        run: |
          set -o pipefail
          gradle -p runtime clean build --stacktrace --no-daemon 2>&1 | tee runtime-build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gameforge-runtime-build-log
          path: runtime-build.log
          if-no-files-found: warn

      - name: Verify runtime JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR='runtime/build/libs/gameforge-runtime-1.20.1-0.3.0.jar'
          test -f "$JAR"
          unzip -t "$JAR"
          unzip -l "$JAR" | grep -q 'META-INF/mods.toml'
          unzip -l "$JAR" | grep -q 'ai/gameforge/runtime/GameForgeRuntime.class'
          unzip -l "$JAR" | grep -q 'ai/gameforge/runtime/AdvancedWeaponHandler.class'
          unzip -l "$JAR" | grep -q 'ai/gameforge/runtime/client/ClientRuntime.class'
          unzip -l "$JAR" | grep -q 'ai/gameforge/runtime/client/GameForgeBrowserScreen.class'
          unzip -l "$JAR" | grep -q 'ai/gameforge/runtime/client/CompactGameForgeBrowserScreen.class'
          unzip -l "$JAR" | grep -q 'ai/gameforge/runtime/client/GameForgeItemFactory.class'
          unzip -p "$JAR" ai/gameforge/runtime/GameForgeRuntime.class | strings | grep -q '1.20.1-0.3.0'
          echo "Verified $JAR"

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: gameforge-runtime-forge-1.20.1
          path: runtime/build/libs/gameforge-runtime-1.20.1-0.3.0.jar
          if-no-files-found: error

      - name: Publish Runtime prerelease
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: runtime-v0.3.0
          name: GameForge Runtime Advanced Weapons 0.3.0
          body: |
            GameForge Runtime 0.3.0 for Minecraft Java 1.20.1 and Forge 47.x.

            Install this JAR on the client and server, place GameForge-generated project JARs in the same mods folder, then press G in-game.

            Changes in 0.3.0:
            - Precise server-side on-hit handling for the actual attacked entity
            - Target groups including undead, hostile, aquatic, arthropod, illager, animals, bosses and specific entities
            - Instant kill, low-health execute, damage multipliers, bonus damage, lifesteal, knockback and status effects
            - Player and tamed-pet safety controls
            - Runtime GUI shows advanced effect names and the generated mechanic summary
            - Responsive full and compact content browser layouts retained
          prerelease: true
          make_latest: false
          files: runtime/build/libs/gameforge-runtime-1.20.1-0.3.0.jar
