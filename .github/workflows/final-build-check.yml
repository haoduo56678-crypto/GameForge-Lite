name: Final Website Build Check

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run verified production build
        run: npm run build
      - name: Verify final advanced release output
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Advanced weapon and Runtime 0.3.0 verification' dist/TEST-REPORT.md
          grep -q '精确命中高级技能需要 Runtime 0.3.0' dist/jar-entry.js
          grep -q '转换器若显示“Runtime 必需”' dist/jar-entry.js
          grep -q 'advanced-weapon-context-patch.js' dist/index.html
          grep -q 'runtime-v0.3.0' dist/runtime.html
