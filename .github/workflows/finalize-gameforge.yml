name: Finalize GameForge Lite 2.1.1

# Final retry marker: release parts 00-13 are present.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-gameforge.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble, validate, and publish the release
        shell: bash
        run: |
          set -euo pipefail

          test -f .release/part-00
          test -f .release/part-13
          cat .release/part-* | tr -d '\r\n' | base64 --decode > /tmp/gameforge-lite.tar.gz
          gzip -t /tmp/gameforge-lite.tar.gz

          rm -rf /tmp/gameforge-site
          mkdir -p /tmp/gameforge-site
          tar -xzf /tmp/gameforge-lite.tar.gz -C /tmp/gameforge-site
          test -f /tmp/gameforge-site/index.html
          test -f /tmp/gameforge-site/js/core.js
          test -f /tmp/gameforge-site/js/generators.js
          test -f /tmp/gameforge-site/js/app.js

          python3 - <<'PY'
          from pathlib import Path

          root = Path('/tmp/gameforge-site')

          replacements = {
              'js/core.js': [("GF.VERSION = '2.1.0';", "GF.VERSION = '2.1.1';")],
              'index.html': [('<small>Lite 2.1</small>', '<small>Lite 2.1.1</small>')],
              'README.md': [
                  ('# GameForge Lite 2.1\n', '# GameForge Lite 2.1.1\n'),
                  ('- 一句话本地解析：识别武器、Boss、装饰方块、配方、掉落表与 Forge Mod 想法', '- 一句话本地解析：识别武器、Boss、装饰方块、配方、掉落表、效果指令与 Forge Mod 想法'),
                  ('- 自动诊断、浏览器自测和日志错误分析\n', '- 自动诊断、浏览器自测和日志错误分析\n- 重复 ID、模型编号和 ZIP 路径自动避让，旧项目字段自动迁移\n'),
              ],
              'sw.js': [("gameforge-lite-v2.1.0", "gameforge-lite-v2.1.1")],
          }

          for relative, pairs in replacements.items():
              path = root / relative
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Expected release marker not found in {relative}: {old!r}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')

          (root / 'CHANGELOG.md').write_text('''# Changelog

## 2.1.1

- 统一掉落表类型与循环函数触发器，并兼容旧项目字段。
- 扩展本地一句话解析，支持概率掉落、九宫格配方和状态效果指令。
- 修复标题颜色、重复组件 ID、CustomModelData 冲突与重复 ZIP 路径。
- 资源包合并时自动去重模型、纹理和基础物品 override。
- 增加回归测试，并完成桌面端、移动端、JSON、ZIP 与 Forge 源码导出测试。

## 2.1.0

- 升级为完整 Minecraft Java 1.20.1 创作工作室。
- 新增项目系统、自定义武器、物品、装饰方块、Boss、进度、资源包与 Forge 源码生成器。
- 新增本地保存、导入导出、文件预览、诊断、自测与 PWA 离线缓存。
''', encoding='utf-8')
          PY

          node --check /tmp/gameforge-site/js/core.js
          node --check /tmp/gameforge-site/js/generators.js
          node --check /tmp/gameforge-site/js/app.js
          node --check /tmp/gameforge-site/sw.js

          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/gameforge-site')
          json.loads((root / 'manifest.webmanifest').read_text(encoding='utf-8'))
          index = (root / 'index.html').read_text(encoding='utf-8')
          for ref in ('styles.css', 'js/core.js', 'js/generators.js', 'js/app.js'):
              if ref not in index or not (root / ref).is_file():
                  raise SystemExit(f'Missing site reference: {ref}')
          PY

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/gameforge-site/. .

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release GameForge Lite 2.1.1'
          git push origin HEAD:main
