name: Materialize GameForge Built Sources

on:
  push:
    branches:
      - audit/full-quality-pass
    paths:
      - '.github/workflows/audit-materialize.yml'
      - 'audit-materialize-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/full-quality-pass
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build verified site
        run: npm run build

      - name: Materialize decoded sources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf audit-decoded
          mkdir -p audit-decoded/js
          cp dist/index.html audit-decoded/
          cp dist/styles.css audit-decoded/
          cp dist/sw.js audit-decoded/
          cp dist/manifest.webmanifest audit-decoded/
          cp dist/js/core.js audit-decoded/js/
          cp dist/js/generators.js audit-decoded/js/
          cp dist/js/app.js audit-decoded/js/
          cp dist/core-mechanisms.js audit-decoded/
          cp dist/local-vocabulary.js audit-decoded/
          cp dist/vocabulary-data.js audit-decoded/
          cp dist/vocabulary-pack.js audit-decoded/
          cp dist/jar-builder.js audit-decoded/
          cp dist/jar-entry.js audit-decoded/
          cp dist/TEST-REPORT.md audit-decoded/

      - name: Commit decoded sources to audit branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'GameForge Audit Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add audit-decoded
          if git diff --cached --quiet; then
            echo 'Decoded sources already current.'
          else
            git commit -m 'Materialize decoded build sources [skip ci]'
            git push origin HEAD:audit/full-quality-pass
          fi
