name: Export GameForge Build Sources for Audit

on:
  pull_request:
    branches:
      - main
    paths:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-built-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build and run existing checks
        run: npm run build

      - name: Collect audit sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-output/js
          cp dist/index.html audit-output/
          cp dist/js/core.js audit-output/js/
          cp dist/js/generators.js audit-output/js/
          cp dist/js/app.js audit-output/js/
          cp dist/core-mechanisms.js audit-output/
          cp dist/local-vocabulary.js audit-output/
          cp dist/vocabulary-data.js audit-output/
          cp dist/vocabulary-pack.js audit-output/
          cp dist/jar-builder.js audit-output/
          cp dist/jar-entry.js audit-output/
          cp dist/TEST-REPORT.md audit-output/
          find audit-output -type f -maxdepth 3 -print -exec wc -c {} \;

      - name: Upload decoded build sources
        uses: actions/upload-artifact@v4
        with:
          name: gameforge-audit-sources
          path: audit-output
          if-no-files-found: error
